[[mods]]
modId="gtcoilemi"
version="0.1.0"
displayName="GT Coil Info for EMI"
authors="kuzel"
description='''
Shows which GregTech heating coil a recipe requires, drawn directly onto
GregTech's EMI recipe pages. Works with custom multiblocks and custom coils
added through KubeJS: the coil list is read from the block registry and the
recipe requirement is read from the recipe's own data tag.

Client side only. Requires EMI and GregTech CEu Modern.
'''

[[dependencies.gtcoilemi]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.gtcoilemi]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.gtcoilemi]]
    modId="emi"
    mandatory=true
    versionRange="[1.1,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.gtcoilemi]]
    modId="gtceu"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
