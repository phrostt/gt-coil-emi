buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        // MixinGradle isn't published on the Gradle Plugin Portal, so it's
        // applied the legacy buildscript+apply way rather than via plugins{}.
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

tasks.withType(JavaCompile).configureEach {
    // CoilRecipeSizeMixin targets GTRecipeWidget by fully-qualified string name
    // with no GTCEU dependency on the compile classpath, so the Mixin AP can't
    // resolve the target class to validate it at compile time.
    //
    // disableTargetValidator only covers a later validation pass (checking
    // @Inject/@ModifyArg targets exist as members of the target class); the
    // actual failure here ("Mixin target ... could not be found") comes from
    // an earlier check, MessageType.MIXIN_SOFT_TARGET_NOT_FOUND in Mixin's AP
    // source (IMessagerEx.java), which is an ERROR by default and is
    // downgraded via its own -AMSG_<NAME>=<level> option.
    options.compilerArgs << "-AdisableTargetValidator=true"
    options.compilerArgs << "-AMSG_MIXIN_SOFT_TARGET_NOT_FOUND=warning"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // Official Mojang mappings. Keep this in sync with what you read in the
    // GregTech sources when adding new reflective lookups.
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'info'
            // Lets the Mixin we ship resolve at dev-time without a refmap.
            property 'mixin.env.disableRefMap', 'true'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'gtcoilemi.refmap.json'
    config 'gtcoilemi.mixins.json'
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // EMI: compile against the mojmap api jar, run against the Forge build.
    compileOnly fg.deobf("dev.emi:emi-xplat-mojmap:${emi_version}:api")
    runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}")

    // Generates gtcoilemi.refmap.json from the @Mixin annotations at compile time.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // NOTE: GregTech is still deliberately NOT a compile dependency, even for
    // CoilRecipeSizeMixin - it targets GTRecipeWidget by fully-qualified string
    // name (see that class's own comment), the same reflection-flavored
    // approach as CoilIndex and RecipeData. This keeps the build free of the
    // GTCEu / LDLib / Registrate dependency chain and survives GregTech API
    // changes (aside from GTRecipeWidget's own constructor shape, which is
    // what the Mixin targets, and what breaks if GTCEU restructures that
    // class in a future update).
    // To test in a dev client, drop the GregTech jars into run/mods instead.
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'gtcoilemi',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'gtcoilemi'
        ])
    }
    finalizedBy 'reobfJar'
}
