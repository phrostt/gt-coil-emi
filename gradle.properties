# Decompiling Minecraft is the heavy step; 3G (the MDK default) makes it crawl.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# A stalled download from the Forge maven otherwise hangs the sync forever
# instead of failing and letting Gradle retry.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000

# --- versions ---------------------------------------------------------------
# Matched to the installed pack: ATM9 1.1.1, Prism instance on D:, GTCEu 7.5.3.
minecraft_version=1.20.1
forge_version=47.4.10
emi_version=1.1.24+1.20.1

# --- mod identity -----------------------------------------------------------
mod_id=gtcoilemi
mod_group_id=com.gtcoilemi
mod_version=0.1.0

# Forge 1.20.1 must be built with JDK 17. IDEA is already using
# C:\Program Files\Java\jdk-17, so this stays commented out.
# org.gradle.java.home=C:/Program Files/Java/jdk-17
